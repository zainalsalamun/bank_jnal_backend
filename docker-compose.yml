version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: bank_jnal_postgres
    restart: always
    environment:
      POSTGRES_USER: jnal_admin
      POSTGRES_PASSWORD: jnal_password
      POSTGRES_DB: bank_jnal
    ports:
      - "5432:5432"
    volumes:
      - jnal_postgres_data:/var/lib/postgresql/data

volumes:
  jnal_postgres_data:
